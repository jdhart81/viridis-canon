name: Phase 8 advisory tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  advisory-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Offline novelty, targeting, metrics and index regressions
        run: python3 -m unittest discover -s 00_lab_infrastructure/advisory/phase8 -p 'test_*.py' -v
