name: research-catalog-and-pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Test deterministic canon core
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Confirm checked-in public catalog is current
        run: python3 tools/build_research_portal.py --check

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify-catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          include-hidden-files: true
      - name: Deploy public research portal
        id: deployment
        uses: actions/deploy-pages@v5

  sync-canon-cloud:
    # Runs in the trusted push context instead of a workflow_run trigger, so no
    # workflow ever checks out a commit chosen by another workflow's event while
    # holding a secret. Dormant unless CANON_CLOUD_URL and the secret are set.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CANON_CLOUD_URL: ${{ vars.CANON_CLOUD_URL }}
      CANON_CLOUD_SYNC_SECRET: ${{ secrets.CANON_CLOUD_SYNC_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - name: Synchronize deterministic catalog
        run: python3 tools/sync_canon_cloud.py --catalog docs/data/catalog.json
