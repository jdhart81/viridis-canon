name: Science audit remediation source checks

on:
  pull_request:
    paths:
      - '00_lab_infrastructure/gates/audit_remediation/**'
      - '00_lab_infrastructure/gates/standalone_pdf_release/**'
      - '00_lab_infrastructure/gates/production_snapshots/phase7-20261008-owned-weekly-source-provenance/**'
      - '00_lab_infrastructure/gates/production_snapshots/phase5-20261004/**'
      - '00_lab_infrastructure/gates/terminal_certification/**'
      - '00_lab_infrastructure/gates/premise_declaration.py'
      - '00_lab_infrastructure/gates/inv9_title_basis.py'
      - '00_lab_infrastructure/gates/certificate_inspection.py'
      - 'comparator-deploy/engine3_align_challenge.py'
      - 'comparator-deploy/issue_lean_zero_sorry_certificate.py'
      - 'comparator-deploy/job_observation_policy.py'
      - 'tools/effective_allocation.py'
      - 'tools/allocation_correction/**'
      - '.github/workflows/science-audit-remediation.yml'
  push:
    branches: [main]
    paths:
      - '00_lab_infrastructure/gates/audit_remediation/**'
      - '00_lab_infrastructure/gates/standalone_pdf_release/**'
      - '00_lab_infrastructure/gates/production_snapshots/phase7-20261008-owned-weekly-source-provenance/**'
      - '00_lab_infrastructure/gates/production_snapshots/phase5-20261004/**'
      - '00_lab_infrastructure/gates/terminal_certification/**'
      - '00_lab_infrastructure/gates/premise_declaration.py'
      - '00_lab_infrastructure/gates/inv9_title_basis.py'
      - '00_lab_infrastructure/gates/certificate_inspection.py'
      - 'comparator-deploy/engine3_align_challenge.py'
      - 'comparator-deploy/issue_lean_zero_sorry_certificate.py'
      - 'comparator-deploy/job_observation_policy.py'
      - 'tools/effective_allocation.py'
      - 'tools/allocation_correction/**'
      - '.github/workflows/science-audit-remediation.yml'

permissions:
  contents: read

jobs:
  pure-source:
    name: science-audit-remediation (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned pure test dependency
        run: python3 -m pip install 'pytest==9.1.1'
      - name: Check the finite public closure and causal controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: timeout --signal=TERM --kill-after=5s 550s python3 -B 00_lab_infrastructure/gates/audit_remediation/run_pure_checks.py --repo . --output "$RUNNER_TEMP/science-audit-remediation-${{ matrix.python }}"
      - name: Retain complete pure test and mutant evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: science-audit-remediation-${{ matrix.python }}
          path: ${{ runner.temp }}/science-audit-remediation-${{ matrix.python }}
          if-no-files-found: error
          retention-days: 14
