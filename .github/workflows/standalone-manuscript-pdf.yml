name: Standalone manuscript PDFs

on:
  pull_request:
    paths:
      - '00_lab_infrastructure/gates/**'
      - 'tools/token_leak_scan.py'
      - 'tools/mutate_manuscript_gate.py'
      - 'tools/mutate_gate_features.py'
      - 'tools/mutate_runbook_fixes.py'
      - 'tools/mutate_audit_hardening.py'
      - 'tools/mutate_nightly_access.py'
      - 'tools/tests/**'
      - 'tools/zenodo_metadata_repair.py'
      - '.github/workflows/standalone-manuscript-pdf.yml'
  push:
    branches: [main]
    paths:
      - '00_lab_infrastructure/gates/**'
      - 'tools/token_leak_scan.py'
      - 'tools/mutate_manuscript_gate.py'
      - 'tools/mutate_gate_features.py'
      - 'tools/mutate_runbook_fixes.py'
      - 'tools/mutate_audit_hardening.py'
      - 'tools/mutate_nightly_access.py'
      - 'tools/tests/**'
      - 'tools/zenodo_metadata_repair.py'
      - '.github/workflows/standalone-manuscript-pdf.yml'

permissions:
  contents: read

jobs:
  manuscript_pdf_matrix:
    name: standalone-manuscript-pdf (${{ matrix.python }})
    runs-on: ubuntu-latest
    env:
      VIRIDIS_CORE_ROOT: /tmp/viridis-core-fixture
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Reject invalid premises before forward generation sealing
        run: python3 -m unittest discover -s 00_lab_infrastructure/gates -p 'test_generation_premise_guard.py' -v
      - name: Verify advisory repair, SLO and Canon lockstep tools
        run: python3 -m unittest discover -s 00_lab_infrastructure/gates/pipeline_advisory/tests -p 'test_*.py' -v
      - name: Verify credential scanner and exact metadata repair tools
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Verify separate manuscripts and exact access-copy exceptions
        run: python3 -m unittest discover -s 00_lab_infrastructure/gates/standalone_pdf_release/tests -p 'test_*.py' -v

      - name: Kill the real manuscript gate mutants
        run: python3 tools/mutate_manuscript_gate.py --source 00_lab_infrastructure/gates/standalone_pdf_release --output "$RUNNER_TEMP/manuscript-gate-mutations.json"

      - name: Kill archive feature and blocking-review mutants
        run: |
          python3 tools/mutate_gate_features.py --source 00_lab_infrastructure/gates/standalone_pdf_release --output "$RUNNER_TEMP/manuscript-feature-mutations.json"
          python3 tools/mutate_runbook_fixes.py --repo . --output "$RUNNER_TEMP/review-finding-mutations.json"
          python3 tools/mutate_audit_hardening.py --repo . --output "$RUNNER_TEMP/audit-hardening-mutations.json"

      - name: Kill archival manuscript access and closed profile mutants
        run: |
          python3 tools/mutate_nightly_access.py --output "$RUNNER_TEMP/nightly-access-mutations"
          python3 00_lab_infrastructure/gates/standalone_pdf_release/runtime/tests/run_archival_profile_mutants.py --python "$(command -v python3)" --output "$RUNNER_TEMP/archival-profile-mutations"

      - name: Verify immutable historical source without full runtime copies
        run: python3 -m unittest discover -s 00_lab_infrastructure/gates/standalone_pdf_release/common/tests -p 'test_*.py' -v
      - name: Verify selected V012 functional coverage and retained provenance gates
        run: python3 -m unittest discover -s 00_lab_infrastructure/gates/standalone_pdf_release/runtime/tests -p 'test_*.py' -v

  complete_archival_source_session:
    name: archival-default-source-session (${{ matrix.python }}, ${{ matrix.partition }})
    runs-on: ubuntu-latest
    env:
      VIRIDIS_CORE_ROOT: /tmp/viridis-core-fixture
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
        partition: ['normal-route', 'negative-controls']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Verify complete measured source and actual normal default archival route
        if: matrix.partition == 'normal-route'
        run: python3 -B -m unittest discover -s 00_lab_infrastructure/gates/standalone_pdf_release/runtime/tests -p 'w42_complete_default_route_test.py' -k test_complete_normal_default_source_review_access_digest_and_pdf_readbacks -v
      - name: Verify complete-source drift and capability negative controls
        if: matrix.partition == 'negative-controls'
        run: python3 -B -m unittest discover -s 00_lab_infrastructure/gates/standalone_pdf_release/runtime/tests -p 'w42_complete_default_route_test.py' -k test_changed_required_source_holds_before_any_note_write -k test_real_facade_exception_revokes_all_session_capabilities -k test_genuine_capability_cannot_authorize_another_root_or_profile_path -v

  standalone-manuscript-pdf:
    # Preserve the exact check name consumed by current and historical source
    # proofs. Neither a failed nor a skipped matrix establishes source CI.
    name: standalone-manuscript-pdf
    needs: [manuscript_pdf_matrix, complete_archival_source_session]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require both Python matrices and complete default source sessions to pass
        env:
          MATRIX_RESULT: ${{ needs.manuscript_pdf_matrix.result }}
          COMPLETE_SOURCE_RESULT: ${{ needs.complete_archival_source_session.result }}
        run: |
          test "$MATRIX_RESULT" = success
          test "$COMPLETE_SOURCE_RESULT" = success
