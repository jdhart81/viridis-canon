name: Standalone manuscript PDFs

on:
  pull_request:
    paths:
      - '00_lab_infrastructure/gates/**'
      - 'tools/token_leak_scan.py'
      - 'tools/mutate_manuscript_gate.py'
      - 'tools/tests/test_token_leak_scan.py'
      - '.github/workflows/standalone-manuscript-pdf.yml'
  push:
    branches: [main]
    paths:
      - '00_lab_infrastructure/gates/**'
      - 'tools/token_leak_scan.py'
      - 'tools/mutate_manuscript_gate.py'
      - 'tools/tests/test_token_leak_scan.py'
      - '.github/workflows/standalone-manuscript-pdf.yml'

permissions:
  contents: read

jobs:
  standalone-manuscript-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Verify credential scanner
        run: python3 -m unittest discover -s tools/tests -p 'test_token_leak_scan.py' -v
      - name: Verify separate manuscripts and exact access-copy exceptions
        run: python3 -m unittest discover -s 00_lab_infrastructure/gates/standalone_pdf_release/tests -p 'test_*.py' -v

      - name: Kill the real manuscript gate mutants
        run: python3 tools/mutate_manuscript_gate.py --source 00_lab_infrastructure/gates/standalone_pdf_release --output "$RUNNER_TEMP/manuscript-gate-mutations.json"

      - name: Verify additive runtime trust, complete defaults and exact registry chains
        run: python3 -m unittest discover -s 00_lab_infrastructure/gates/standalone_pdf_release/future_runtime_v001/tests -p 'test_*.py' -v

      - name: Verify v002 cold scope, exact recovery and bounded scientific input data
        run: python3 -m unittest discover -s 00_lab_infrastructure/gates/standalone_pdf_release/future_runtime_v002/tests -p 'test_*.py' -v

      - name: Verify v003 exact historical DATA alias and immutable predecessors
        run: python3 -m unittest discover -s 00_lab_infrastructure/gates/standalone_pdf_release/future_runtime_v003/tests -p 'test_*.py' -v

      - name: Verify v004 exact native New York timezone DATA and immutable predecessors
        run: python3 -m unittest discover -s 00_lab_infrastructure/gates/standalone_pdf_release/future_runtime_v004/tests -p 'test_*.py' -v

      - name: Verify v005 pure DATA material, exact OWNER buffers and genuine HOLD evidence
        run: python3 -m unittest discover -s 00_lab_infrastructure/gates/standalone_pdf_release/future_runtime_v005/tests -p 'test_*.py' -v

      - name: Verify v006 immutable descriptors and fresh source path guards
        run: python3 -m unittest discover -s 00_lab_infrastructure/gates/standalone_pdf_release/future_runtime_v006/tests -p 'test_*.py' -v

      - name: Verify v007 distinct readonly evaluations and bounded owner transport
        run: python3 -m unittest discover -s 00_lab_infrastructure/gates/standalone_pdf_release/future_runtime_v007/tests -p 'test_*.py' -v

      - name: Verify v008 historical access topology and immutable seven predecessors
        run: python3 -m unittest discover -s 00_lab_infrastructure/gates/standalone_pdf_release/future_runtime_v008/tests -p 'test_*.py' -v

      - name: Verify v009 exact Python sentinel state and immutable eight predecessors
        run: python3 -m unittest discover -s 00_lab_infrastructure/gates/standalone_pdf_release/future_runtime_v009/tests -p 'test_*.py' -v
      - name: Verify v010 exact JSON class state, retained diagnostics and immutable nine predecessors
        run: python3 -m unittest discover -s 00_lab_infrastructure/gates/standalone_pdf_release/future_runtime_v010/tests -p 'test_*.py' -v
      - name: Verify v011 stable complete code fingerprints and immutable ten predecessors
        run: python3 -m unittest discover -s 00_lab_infrastructure/gates/standalone_pdf_release/future_runtime_v011/tests -p 'test_*.py' -v
      - name: Verify v012 master failure evidence and immutable eleven predecessors
        run: python3 -m unittest discover -s 00_lab_infrastructure/gates/standalone_pdf_release/future_runtime_v012/tests -p 'test_*.py' -v
      - name: Verify v013 size-aware bounded transfers and immutable twelve predecessors
        run: python3 -m unittest discover -s 00_lab_infrastructure/gates/standalone_pdf_release/future_runtime_v013/tests -p 'test_*.py' -v
