name: Verification coverage consumers
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
env:
  CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  coverage-shard:
    name: coverage-shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        shard: [A, B, C]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install the pinned independent file metadata parser
        run: python3 -m pip install --disable-pip-version-check -r 00_lab_infrastructure/gates/byte_metadata_requirements.txt
      - name: Runner regression controls
        run: python3 -m unittest discover -s tools/ci/tests -p 'test_*.py' -v
      - name: Run coverage shard
        run: |
          python3 tools/ci/verification_coverage_runner.py run-shard \
            --shard ${{ matrix.shard }} --output .ci-coverage/report-${{ matrix.shard }}.json \
            --revision "$GITHUB_SHA" --source-head "$CI_SOURCE_HEAD"
      - name: Retain shard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-${{ github.run_attempt }}-${{ matrix.shard }}
          path: .ci-coverage/report-${{ matrix.shard }}.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  report-only-consumers:
    if: always()
    needs: [coverage-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Read every completed shard report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-report-${{ github.run_attempt }}-*
          path: .ci-coverage/reports
          merge-multiple: true
      - name: Authenticate completed whole-job and step timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > .ci-coverage/job-api.json
      - name: Require every shard and the exact execution multiset
        env:
          MATRIX_STATUS: ${{ needs.coverage-shard.result }}
        run: |
          python3 tools/ci/verification_coverage_runner.py aggregate \
            --reports .ci-coverage/reports --api-jobs .ci-coverage/job-api.json \
            --revision "$GITHUB_SHA" --source-head "$CI_SOURCE_HEAD" \
            --matrix-status "$MATRIX_STATUS"
