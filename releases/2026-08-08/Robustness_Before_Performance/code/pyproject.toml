[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robustness-engine"
version = "0.6.0"
description = "A governed, domain-independent robustness decision kernel"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20,<5"]

[project.scripts]
robustness-evaluate = "robustness_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
